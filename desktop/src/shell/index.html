<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data:" />
    <title>Agent Loft</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <nav class="rail">
      <div class="rail-top"></div>
      <div class="servers" id="servers"></div>
      <div class="rail-divider" id="rail-divider"></div>
      <button class="rail-btn" id="add" title="添加服务器" aria-label="添加服务器">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13" /></svg>
      </button>
      <div class="rail-fill"></div>
      <button class="rail-btn" id="settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </nav>
    <main class="panel" id="panel"></main>
    <!-- 右侧面板顶部一条：按住拖动窗口（面板内容本身留了足够的上边距，这里没有可点的东西） -->
    <div class="drag-strip"></div>
    <script src="common.js"></script>
    <script src="setup.js"></script>
    <script src="server-dialog.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
