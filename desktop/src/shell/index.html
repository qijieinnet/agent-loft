<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data:" />
    <title>Agent Loft</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- 顶栏：红绿灯后面是各服务器的标签（图标 + 名称），「更多」在最右边（用量汇总、桌面端设置、各服务器的设置）；下面整块给当前服务器的页面 -->
    <header class="topbar">
      <div class="tabs" id="servers"></div>
      <div class="bar-fill"></div>
      <button class="bar-btn" id="more" title="更多" aria-label="更多">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <circle cx="5" cy="12" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="19" cy="12" r="1.8" />
        </svg>
      </button>
    </header>
    <main class="panel" id="panel"></main>
    <script src="common.js"></script>
    <script src="sortable.js"></script>
    <script src="setup.js"></script>
    <script src="server-dialog.js"></script>
    <script src="usage.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
