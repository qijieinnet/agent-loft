<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data:" />
    <title>Agent Loft</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- 顶栏：红绿灯后面是各服务器的标签（图标 + 名称），紧跟着用量汇总、桌面端设置两个按钮；
         各服务器的设置在页面自己的「更多」里。下面整块给当前服务器的页面 -->
    <header class="topbar">
      <div class="tabs" id="servers"></div>
      <button class="bar-btn" id="usage" title="用量汇总" aria-label="用量汇总">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 21h18" />
          <path d="M7 17v-5" />
          <path d="M12 17V4" />
          <path d="M17 17V8" />
        </svg>
      </button>
      <button class="bar-btn" id="settings" title="桌面端设置" aria-label="桌面端设置">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
      <div class="bar-fill"></div>
    </header>
    <main class="panel" id="panel"></main>
    <script src="common.js"></script>
    <script src="sortable.js"></script>
    <script src="setup.js"></script>
    <script src="server-dialog.js"></script>
    <script src="usage.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
