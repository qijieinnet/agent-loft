# 打包桌面端（macOS、Windows、Linux），发到 GitHub Release。
#
# 发版：改 desktop/package.json 的 version，打一个 desktop-v 开头的 tag 推上来，例如
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
# 和服务端的 v* tag（publish.yml，发 npm）互不影响：桌面端只是个壳，很少需要发版。
#
# 产物（App 内一键更新按文件名挑，改名要同步改 desktop/src/updater.js）：
#   - macOS：Apple 芯片和 Intel 各一个 DMG（首次安装）和 zip（App 内一键更新用）。
#     没有 Apple 开发者账号，只做 ad-hoc 签名：首次打开会被 Gatekeeper 拦，要在
#     系统设置 → 隐私与安全性 里点「仍要打开」。App 内更新不经过 Gatekeeper，之后就不会再拦。
#   - Windows：x64 的安装程序（NSIS，装在用户目录，不用管理员权限；App 内更新也是静默跑它）。
#     没有代码签名证书，首次运行 SmartScreen 会拦，点「更多信息 → 仍要运行」。
#   - Linux：x64 / arm64 各一个 AppImage（App 内一键更新用）和 deb。
# 三个平台并行打包，最后一个 job 统一建 Release、传附件（免得几个 job 抢着建同一个 Release）。
name: desktop

on:
  push:
    tags: ["desktop-v*"]
  # 手动触发只打包、存成构建产物，不发 Release
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-15
            dist: dist:mac
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
          - name: Windows
            os: windows-latest
            dist: dist:win
            files: |
              desktop/dist/Agent-Loft-Setup-*-x64.exe
          - name: Linux
            os: ubuntu-24.04
            dist: dist:linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: tag 要和 desktop/package.json 的版本对上
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag 是 $want，desktop/package.json 里是 $have，先改成一致再打 tag"
            exit 1
          fi

      - run: npm ci

      # 自己的几个界面（向导、设置页、菜单栏 / 托盘面板）真的画得出来、没有脚本报错，才打包。
      # 不用 npm run smoke：那里的 VAR=1 写法 Windows 的 cmd 不认
      - name: 冒烟测试
        env:
          AGENT_LOFT_DESKTOP_SMOKE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
            # Ubuntu 24.04 的 AppArmor 不让 node_modules 里的 Electron 开沙箱，测试时关掉
            xvfb-run -a npx electron . --no-sandbox
          else
            npx electron .
          fi

      - name: 打包
        env:
          # 没有证书：macOS 别去钥匙串里找，直接 ad-hoc；Windows 不签名
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist }}

      - name: 存成构建产物
        uses: actions/upload-artifact@v7
        with:
          name: agent-loft-desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 手动触发时也跑：只把三个平台的产物收齐、列出来（验证下载这一步），不发 Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-loft-desktop-*
          path: dist
          merge-multiple: true

      - name: 收齐的产物
        run: ls -la dist

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="Agent Loft 桌面端 ${version}

          **macOS**
          - Apple 芯片：Agent-Loft-${version}-arm64.dmg
          - Intel：Agent-Loft-${version}-x64.dmg

          首次打开如果提示「无法验证开发者」，到 系统设置 → 隐私与安全性 里点「仍要打开」。

          **Windows**
          - Agent-Loft-Setup-${version}-x64.exe（ARM 的 Windows 也能装）

          首次运行如果 SmartScreen 提示「已保护你的电脑」，点「更多信息 → 仍要运行」。

          **Linux**
          - Debian / Ubuntu：agent-loft-desktop_${version}_amd64.deb（ARM 选 arm64），sudo apt install ./文件名.deb
          - 其他发行版：Agent-Loft-${version}-x86_64.AppImage（ARM 选 arm64），chmod +x 后直接运行，需要 libfuse2；App 内一键更新只支持 AppImage
          - 托盘图标在 GNOME 上要装 AppIndicator 扩展才显示

          已经装过的，在 App 的 设置 → 更新 里点「更新并重启」即可。"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "桌面端 ${version}" --notes "$notes"
          fi
