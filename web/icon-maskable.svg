<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Agent Loft — 汇合</title>
  <rect width="512" height="512" fill="#FFFFFF"/>
  <defs>
    <mask id="loft-center" maskUnits="userSpaceOnUse" x="-180" y="-180" width="360" height="360">
      <rect x="-180" y="-180" width="360" height="360" fill="#FFFFFF"/>
      <circle r="21" fill="#000000"/>
    </mask>
  </defs>
  <g fill="#FF7444" color="#FF7444">
    <g transform="translate(256 256)">
      <g mask="url(#loft-center)">
        <g class="lc-rotor">
          <g class="lc-arm lc-arm-0"><rect x="-33" y="-133" width="66" height="139" rx="33" fill="#FF7444"/></g>
          <g transform="rotate(120)"><g class="lc-arm lc-arm-1"><rect x="-33" y="-133" width="66" height="139" rx="33" fill="#FFB15B"/></g></g>
          <g transform="rotate(240)"><g class="lc-arm lc-arm-2"><rect x="-33" y="-133" width="66" height="139" rx="33" fill="#F65364"/></g></g>
        </g>
      </g>
    </g>
  </g>
</svg>
