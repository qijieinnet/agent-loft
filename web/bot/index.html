<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="referrer" content="no-referrer">
  <title>Loft Bot</title>
  <link rel="icon" href="/bot/icons/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/bot/icons/apple-touch.png">
  <link rel="manifest" href="/bot/manifest.webmanifest">
  <link rel="stylesheet" href="/bot/style.css">
  <link rel="stylesheet" href="/bot/panels.css">
  <script type="module" src="/bot/app.js"></script>
</head>
<body>
  <main id="gate"><div class="auth-card"><img class="mark" src="/bot/icons/mark.svg" alt=""><h1>Loft Bot</h1><p>正在打开…</p></div></main>
  <main id="chat" hidden>
    <aside id="rail" aria-label="Bot 导航">
      <header class="rail-head"><div class="rail-title"><h1 id="rail-title" tabindex="-1">对话</h1>
        <button id="rail-add" class="icon-button rail-create" type="button" aria-label="新建私人 Bot" title="新建私人 Bot"></button></div>
        <label class="rail-search"><span id="search-glyph" aria-hidden="true"></span><input type="search" id="rail-search" aria-label="搜索对话" placeholder="搜索对话" autocomplete="off"></label>
      </header>
      <nav id="rail-list" aria-label="选择对话"></nav>
      <p id="rail-empty" hidden>没有找到匹配的对话</p>
      <div class="rail-foot"><button id="rail-account" type="button" aria-label="账号和通知" title="账号和通知"><span id="initial"></span><span id="account-name-label"></span></button>
        <button id="rail-inbox" class="icon-button" type="button" aria-label="最近通知" title="最近通知"></button>
        <button id="rail-decisions" class="icon-button" type="button" aria-label="待我确认" title="待我确认"></button></div>
    </aside>
    <header class="bar"><div class="bar-inner">
      <button id="choose" class="icon-button" type="button" aria-label="返回对话列表" title="返回对话列表"></button>
      <button id="manage" class="identity" type="button" aria-label="对话设置" title="对话设置" aria-haspopup="dialog">
        <span id="active-avatar" aria-hidden="true"></span>
        <span class="identity-label"><strong id="bot-name"></strong><small id="audience"></small></span>
      </button>
    </div></header>
    <section id="scroll" aria-label="当前对话" tabindex="-1">
      <div id="empty" class="empty" hidden>
        <div id="welcome-avatar" aria-hidden="true"></div>
        <h1 id="greeting">有什么想交给我？</h1>
        <p id="purpose" hidden></p>
      </div>
      <div class="conversation"><button id="older" type="button" hidden>查看更早的消息</button><ol id="messages" aria-label="消息"></ol><div id="delegation-cards" hidden></div></div>
    </section>
    <footer class="compose-wrap"><div class="compose-inner">
      <div id="status" class="notice" role="status" hidden></div>
      <div id="reminders" class="reminder-strip" hidden></div>
      <form id="compose">
        <div id="preview" hidden></div>
        <div class="input-row">
          <button id="attach" class="icon-button" type="button" aria-label="添加" title="添加" aria-haspopup="menu" aria-controls="compose-actions" aria-expanded="false" popovertarget="compose-actions"></button>
          <div id="compose-actions" role="menu" aria-label="添加到对话" popover="auto" hidden>
            <button id="choose-photo" type="button" role="menuitem" tabindex="-1">照片</button>
            <button id="choose-reminder" type="button" role="menuitem" tabindex="-1">提醒</button>
          </div>
          <input id="photo" type="file" accept="image/*" hidden>
          <div class="compose-field">
            <label class="sr" for="message">消息</label>
            <textarea id="message" rows="1" placeholder="发消息…" maxlength="12000"></textarea>
            <button id="send" class="send icon-button" type="submit" aria-label="发送消息" title="发送消息" disabled></button>
          </div>
        </div>
      </form>
      <div id="starters" class="starters" hidden><button id="start-photo" type="button">读一张照片</button><button id="start-reminder" type="button">设个提醒</button><button id="start-follow" type="button">跟进一件事</button></div>
    </div></footer>
  </main>
  <dialog id="panel" aria-labelledby="panel-title" closedby="any" autofocus>
    <header class="sheet-head"><div><h2 id="panel-title"></h2></div><button class="icon-button" id="panel-close" type="button" aria-label="关闭"></button></header>
    <div id="panel-body"></div>
    <p id="panel-error" role="alert" hidden></p>
    <footer id="panel-actions" hidden></footer>
  </dialog>
  <div class="sr" id="announce" role="status"></div>
</body>
</html>
